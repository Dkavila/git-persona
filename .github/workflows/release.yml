name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser needs full history and all tags for the changelog and
          # version resolution. A shallow clone breaks it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        # Fail before publishing anything, not after.
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the Windows binary for Inno Setup
        shell: pwsh
        run: |
          # GoReleaser writes each build to a directory encoding the target,
          # e.g. dist\git-pilot_windows_amd64_v1\git-pilot.exe. That _v1
          # suffix comes from GOAMD64 and can change, so discover the path.
          $binary = Get-ChildItem -Path dist -Recurse -Filter 'git-pilot.exe' |
                    Where-Object { $_.DirectoryName -match 'windows_amd64' } |
                    Select-Object -First 1

          if (-not $binary) {
            Get-ChildItem -Path dist -Recurse | Select-Object FullName | Format-Table -AutoSize
            throw 'Could not find the windows/amd64 binary in dist. Layout dumped above.'
          }

          $stage = Join-Path $PWD 'dist\installer-input'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $binary.FullName -Destination $stage -Force

          "INNO_BINARY_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        id: inno
        uses: ./.github/actions/inno-setup

      - name: Build the Inno Setup installer
        shell: pwsh
        run: |
          # Strip the leading "v": Inno's AppVersion expects a bare version.
          $version = "${{ github.ref_name }}" -replace '^v', ''

          # VersionInfoVersion accepts digits and dots only, so a pre-release
          # tag such as v1.0.0-rc1 has to lose its suffix here.
          $numeric = ($version -split '-')[0]

          # Named like every other asset: git-pilot_<version>_windows_installer.
          # No architecture in the name, because there is one installer. It is
          # built x64compatible, so it runs on ARM64 through emulation while
          # installing the amd64 binary; calling it amd64 would imply an arm64
          # installer exists.
          $base    = "git-pilot_${version}_windows_installer"
          $output  = Join-Path $PWD 'dist\installer'

          & "${{ steps.inno.outputs.iscc }}" `
            "/DBinaryDir=$env:INNO_BINARY_DIR" `
            "/DAppVersion=$version" `
            "/DVersionInfo=$numeric" `
            "/DOutputDir=$output" `
            "/DOutputBaseFilename=$base" `
            "build\windows\installer.iss"

          if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit code $LASTEXITCODE" }

          "INSTALLER=$output\$base.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Attach the installer and its checksum to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GoReleaser only hashes what it builds itself, and the installer is
          # produced afterwards by a separate compiler. Left alone, the one
          # asset Windows users actually download is the one asset with no
          # published checksum.
          $sums = Join-Path $PWD 'dist\checksums.txt'
          if (-not (Test-Path $sums)) {
            throw "checksums.txt not found at $sums; GoReleaser did not produce it."
          }

          $name = Split-Path $env:INSTALLER -Leaf
          $hash = (Get-FileHash -Algorithm SHA256 $env:INSTALLER).Hash.ToLower()

          # Drop any previous entry first, so re-running a tag cannot write the
          # file name twice.
          $lines  = @(Get-Content $sums | Where-Object { $_ -notmatch [regex]::Escape($name) })
          $lines += "$hash  $name"

          # LF, explicitly. Set-Content would write CRLF on Windows, and
          # sha256sum -c then looks for a file whose name ends in a carriage
          # return and reports every line as missing.
          [System.IO.File]::WriteAllText($sums, ($lines -join "`n") + "`n")

          Get-Content $sums

          gh release upload "${{ github.ref_name }}" `
            "$env:INSTALLER" "$sums" --clobber

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-debug
          path: dist
          retention-days: 5