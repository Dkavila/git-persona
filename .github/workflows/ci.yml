# Continuous integration: every push to main and every pull request.
#
# The matrix is not decoration. This project has platform-specific behaviour
# worth guarding on all three:
#   - the file-permission specs are Unix-only and never run on Windows
#   - the CRLF trimming and core.sshCommand path quoting exist for Windows
#   - macOS is where most Go developers would install it from source
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result, rather than cancelling the rest on the
      # first failure. A Windows-only break is the interesting signal here.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        # gofmt -l prints files that need formatting and exits 0 either way,
        # so the output itself has to be turned into the failure.
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        # -race catches data races in the concurrent verify sweep, which is
        # exactly the code a plain test run would let through.
        run: go test -race ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Measure
        run: |
          go test -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out | tail -1

      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Two things matter here, and they are coupled.
      #
      # 1. The action major version. golangci-lint-action v6 can only install
      #    golangci-lint v1, which is why "version: latest" previously resolved
      #    to v1.64.8 rather than anything newer. v2 support starts at action
      #    v7; v8 requires golangci-lint >= v2.1.0.
      #
      # 2. The linter version is pinned, never "latest". A linter that updates
      #    itself turns an unrelated commit into a red build, and new default
      #    rules arrive without anyone choosing them.
      #
      # The original failure was a toolchain mismatch: the released binary was
      # built with an older Go than this module targets, and golangci-lint
      # refuses to analyse a newer language version than its own:
      #
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.27.1)
      #
      # A recent v2 build is expected to clear it, but that depends on which Go
      # the release was compiled with, which is not something the version
      # number states. If this job fails the same way again, the linter has not
      # caught up with this Go release yet: bump the pin to a newer tag, or
      # drop this job. go vet and the gofmt check in the test job already cover
      # the essentials on all three platforms.
      #
      # Note for later: golangci-lint v2 uses a new config schema. A
      # .golangci.yml added from here on must declare version: "2".
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --timeout=5m

  build:
    name: build (cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Catches a release-time break early: the pipeline ships six targets, so
      # a compile error on an architecture nobody develops on should fail here
      # rather than during a tagged release.
      - name: Cross-compile every release target
        env:
          CGO_ENABLED: 0
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            echo "building $os/$arch"
            GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/git-pilot
          done
  # The installer is the one artifact no Go test can cover: it is compiled by a
  # separate tool, from a script with its own preprocessor and its own failure
  # modes. Publishing v0.1.0 cost four fixes to this pipeline — an ISPP #elif
  # bug, a binary looked for in the wrong directory, diff markers pasted into
  # the workflow and a truncated iscc invocation. Every one of them surfaced
  # only when a tag was pushed, which is the most expensive place to find them.
  #
  # This job compiles the same script with the same pinned compiler the release
  # uses, so the break lands on the pull request instead.
  #
  # It runs on every event rather than filtering with `paths:`. A job skipped by
  # `paths:` never reports, so a required check configured on it leaves every
  # unrelated pull request pending forever. Deciding inside the job keeps the
  # check reportable, and therefore usable as a branch protection requirement.
  installer:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff below needs the base commit, which a shallow clone lacks.
          fetch-depth: 0

      - name: Decide whether the installer needs compiling
        id: scope
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac

          # No usable base (first push of a branch, a manual run): compile.
          # Erring towards compiling costs a minute; erring the other way is
          # how a broken script reaches a tag.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base"...HEAD |
             grep -Eq '^(build/windows/|\.github/workflows/ci\.yml|\.github/actions/inno-setup/)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No installer-related changes in this diff; nothing to compile."
          fi

      - uses: actions/setup-go@v5
        if: steps.scope.outputs.needed == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Stage a binary for the installer
        if: steps.scope.outputs.needed == 'true'
        shell: pwsh
        # The script refuses to compile without the exe it packages, so the
        # check needs a real binary. It is never published; only its presence
        # and path matter here.
        run: go build -o dist\installer-input\git-pilot.exe .\cmd\git-pilot

      - name: Install Inno Setup
        id: inno
        if: steps.scope.outputs.needed == 'true'
        uses: ./.github/actions/inno-setup

      - name: Compile the installer script
        if: steps.scope.outputs.needed == 'true'
        shell: pwsh
        # The same defines the release passes, so this exercises the real code
        # path rather than the bare `iscc installer.iss` fallback. The version
        # is a placeholder: nothing here is published.
        run: |
          & "${{ steps.inno.outputs.iscc }}" `
            "/DBinaryDir=$PWD\dist\installer-input" `
            "/DAppVersion=0.0.0-ci" `
            "/DVersionInfo=0.0.0" `
            "/DOutputDir=$PWD\dist\installer" `
            "/DOutputBaseFilename=ci-check" `
            "build\windows\installer.iss"

          if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit code $LASTEXITCODE" }
